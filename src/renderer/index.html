<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' cci-asset:; img-src 'self' cci-asset: file: data: blob: https://i.ytimg.com https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com;" />
  <title>Coach Intel</title>
  <link rel="stylesheet" href="styles.css?v=20260826-v210" />
  <script src="lock-copy.js"></script>
</head>
<body>
  <div id="atmosphere" class="splash-atmosphere" aria-hidden="true">
    <span class="arena-field arena-field-soft"></span>
    <span class="arena-field"></span>
    <span class="arena-hex"></span>
    <span class="arena-scan"></span>
    <span class="arena-grain"></span>
    <span class="splash-flow splash-flow-a"></span>
    <span class="splash-flow splash-flow-b"></span>
    <span class="splash-flow splash-flow-c"></span>
    <span class="splash-flow splash-flow-d"></span>
    <span class="arena-art">
      <img class="arena-art-img" alt="" draggable="false">
      <span class="arena-art-tint" aria-hidden="true"></span>
    </span>
  </div>
  <div id="splash">
    <img class="splash-background" src="cci-asset://static/splash-background.png" alt="" draggable="false" />
    <img class="splash-frost" src="cci-asset://static/splash-background.png" alt="" draggable="false" />
    <span class="splash-glow" aria-hidden="true"></span>
    <span class="splash-veil" aria-hidden="true"></span>
    <div class="splash-stage">
      <div class="splash-logo">
        <div class="splash-logo-mark-frame">
          <img class="splash-logo-mark" src="cci-asset://static/splash-logo.png" alt="Coach Intel logo" draggable="false" />
        </div>
        <div class="splash-lockup-copy">
          <div class="splash-wordmark-frame">
            <img class="splash-wordmark" src="cci-asset://static/splash-wordmark.png" alt="Coach Intel" draggable="false" />
          </div>
          <div class="splash-slogan-frame">
            <img class="splash-slogan" src="cci-asset://static/splash-slogan.png" alt="Competitive Intelligence for Call of Duty" draggable="false" />
          </div>
        </div>
      </div>
      <div class="splash-meta">
        <div class="splash-bar" aria-hidden="true">
          <span class="splash-bar-fill"></span>
          <span class="splash-bar-sheen"></span>
        </div>
        <div class="splash-version" id="splash-version">Version 2.1.0</div>
      </div>
    </div>
  </div>
  <div id="app" class="booting">
    <nav id="sidebar" aria-label="Global navigation"></nav>
    <div class="main-column">
      <header id="topbar"></header>
      <main id="content"></main>
      <footer id="statusbar"></footer>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
