<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coach Intel</title>
  <meta name="description" content="Coach Intel — competitive intelligence for Call of Duty. Open the desktop app from this page." />
  <link rel="icon" href="assets/logo-mark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="pit" aria-hidden="true"></div>
  <main class="stage">
    <div class="lockup">
      <span class="ci-lockup" role="img" aria-label="Coach Intel">
        <img class="ci-lockup-base" src="assets/logo-mark-base.png" alt="" />
        <span class="ci-lockup-accent" aria-hidden="true"></span>
      </span>
      <div class="lockup-copy">
        <img class="wordmark" src="assets/wordmark.png" alt="Coach Intel" />
        <img class="slogan" src="assets/slogan.png" alt="Competitive Intelligence for Call of Duty" />
      </div>
    </div>
    <p class="line">Know More. Win More.</p>
    <a class="open" href="coachintel://">Open Coach Intel</a>
    <p class="hint">
      Opens the app already installed on this Mac.
      If nothing happens, install Coach Intel and try again.
    </p>
    <a class="ecs" href="https://www.championshipseries.eu/">European Championship Series</a>
  </main>
</body>
</html>
